[package]
name = "global-keybinds"
version = "0.1.0"
edition = "2024"

[dependencies]
# the desktop's GlobalShortcuts portal on zbus, without tokio (as screen-capture's capture)
ashpd = { version = "0.13", default-features = false, features = ["async-io", "global_shortcuts"] }
async-io = "2"
futures-util = "0.3"

[profile.release]
opt-level = "s"
lto = true
panic = "abort"
strip = true
