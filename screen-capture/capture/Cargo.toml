[package]
name = "mincord-capture"
version = "0.3.0"
edition = "2021"
license = "MIT"
description = "mincord's Go Live encoder"

[dependencies]
# Discord's fork (crates.md): Display is Arc + Send + Sync; the raw bindings are re-exported
# vendored: its pinned headers (libva 2.22); the fork does not build against nixpkgs 2.24 headers (new VP9 fields)
cros-libva = { git = "https://github.com/discord/cros-libva", rev = "896a248e003caae7a7120812f7eaa423c93a920d", features = ["vendored"] }
anyhow = "1"
# the cast's input; v1_2_0 for the modifier's DONT_FIXATE flag
pipewire = { version = "0.10", features = ["v1_2_0"] }
# niri's cast: the Mutter ScreenCast D-Bus API (blocking proxies)
zbus = "5"
libc = "0.2"
# the portal source (P4): xdg ScreenCast on zbus, without tokio; futures-lite blocks on its calls at startup
ashpd = { version = "0.13", default-features = false, features = ["async-io", "screencast"] }
futures-lite = "2"

[profile.release]
debug = 1
