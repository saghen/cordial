[package]
name = "mincord-capture"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "mincord's Go Live encoder (the Rust port of capture/, P2)"

[[bin]]
name = "mincord-capture-rs"
path = "src/main.rs"

[dependencies]
# Discord's fork (crates.md): Display is Arc + Send + Sync; the raw bindings are re-exported
# vendored: its pinned headers (libva 2.22); the fork does not build against nixpkgs 2.24 headers (new VP9 fields)
cros-libva = { git = "https://github.com/discord/cros-libva", rev = "896a248e003caae7a7120812f7eaa423c93a920d", features = ["vendored"] }
anyhow = "1"
libc = "0.2"

[profile.release]
debug = 1
